[project]
name = "fantasy-football-prediction"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "matplotlib>=3.9",
    "nflreadpy==0.1.5",
    "numpy>=2.0",
    "polars>=1.30",
    "scikit-learn>=1.5",
]

[project.scripts]
ffpred = "ffpred.cli.app:run"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ffpred"]

[dependency-groups]
dev = [
    "hypothesis>=6.165.10",
    "pre-commit>=4.6.2",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "syrupy>=5.5.3",
    "ty>=0.0.73",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
markers = [
    "live: tests that access live nflverse data",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E",
    "F",
    "I",
    "NPY",
    "PERF",
    "PL",
    "PTH",
    "RUF",
    "SIM",
    "T20",
    "TRY",
    "UP",
]
ignore = [
    # Removed as typed domain/config modules replace the legacy scripts.
    "PERF203",
    "PLR0913",
    "PLR0917",
    "PLR2004",
    "T201",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.rules]
possibly-unresolved-reference = "error"
unresolved-import = "error"

[tool.ty.terminal]
error-on-warning = false
