[project]
name = "fantasy-football-prediction"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "altair>=5.5,<6",
    "matplotlib>=3.9",
    "nflreadpy==0.1.5",
    "numpy>=2.0",
    "polars>=1.30",
    "scikit-learn>=1.5",
    "streamlit>=1.47,<2",
]

[project.scripts]
ffpred = "ffpred.cli.app:run"
ffpred-dashboard = "ffpred.dashboard.app:run"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ffpred"]

[dependency-groups]
dev = [
    "hypothesis>=6.165.10",
    "pre-commit>=4.6.2",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "syrupy>=5.5.3",
    "ty>=0.0.73",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
markers = [
    "live: tests that access live nflverse data",
    "live_slow: large live nflverse downloads run only on demand",
]

[tool.coverage.run]
branch = true
source = ["ffpred"]
# Streamlit executes the view module in its own ScriptRunner context. It is
# exercised with AppTest, but that context is not observed by coverage.py.
omit = ["src/ffpred/dashboard/app.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E",
    "F",
    "I",
    "NPY",
    "PERF",
    "PL",
    "PTH",
    "RUF",
    "SIM",
    "T20",
    "TRY",
    "UP",
]
ignore = [
    # Contextual messages are intentionally kept beside their validation logic.
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"src/ffpred/cli/**" = ["T201"]
"tests/**" = ["PLR2004"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.rules]
all = "error"
possibly-unresolved-reference = "error"
unresolved-import = "error"
